<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>CalcPro | Calculadora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            font-family: "DM Sans", sans-serif;
            background: #0b1020;
            color: #f5f7ff;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px 16px;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 18% 15%, rgba(87, 67, 196, 0.2), transparent 34%),
                radial-gradient(ellipse at 83% 86%, rgba(22, 126, 160, 0.15), transparent 34%),
                #0b1020;
        }

        button {
            font: inherit;
        }

        .calculator {
            width: min(100%, 400px);
            padding: 26px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 30px;
            background: linear-gradient(150deg, rgba(28, 35, 59, 0.97), rgba(17, 23, 41, 0.98));
            box-shadow: 0 32px 90px rgba(0, 0, 0, 0.48), 0 0 70px rgba(104, 79, 231, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border: 1px solid rgba(162, 137, 255, 0.3);
            border-radius: 14px;
            background: rgba(130, 97, 255, 0.15);
            color: #b6a2ff;
            overflow: hidden;
        }

        .brand-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 30% 25%;
        }

        .brand-name {
            margin: 0;
            font-family: "Space Grotesk", sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .brand-name span {
            color: #a48bff;
        }

        .brand-caption {
            margin: 3px 0 0;
            color: #8790aa;
            font-size: 9px;
            letter-spacing: 1.8px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #91a0b8;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #58d6a0;
            box-shadow: 0 0 12px rgba(88, 214, 160, 0.8);
        }

        .screen {
            display: flex;
            min-height: 150px;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 20px;
            padding: 19px 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.055);
            border-radius: 20px;
            background: rgba(8, 13, 27, 0.85);
            text-align: right;
        }

        .screen-label {
            color: #7e8aa5;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .history {
            min-height: 22px;
            margin-top: 12px;
            overflow: hidden;
            color: #818ba5;
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .display {
            margin-top: 5px;
            overflow-x: auto;
            color: #f8f9ff;
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(32px, 10vw, 44px);
            font-weight: 500;
            letter-spacing: -1.5px;
            line-height: 1.15;
            scrollbar-width: thin;
            white-space: nowrap;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 11px;
        }

        .btn {
            min-width: 0;
            height: 62px;
            border: 1px solid rgba(255, 255, 255, 0.035);
            border-radius: 16px;
            background: #252e49;
            box-shadow: 0 4px 0 #171e33;
            color: #f4f5fb;
            cursor: pointer;
            font-size: 19px;
            font-weight: 600;
            transition: transform 140ms ease, filter 140ms ease, background 140ms ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        .btn:active {
            box-shadow: none;
            transform: translateY(3px);
        }

        .btn:focus-visible {
            outline: 2px solid #b5a2ff;
            outline-offset: 3px;
        }

        .function {
            background: #30294b;
            box-shadow: 0 4px 0 #211d36;
            color: #c1afff;
            font-size: 16px;
        }

        .operator {
            background: #1d3851;
            box-shadow: 0 4px 0 #14273a;
            color: #81d1ff;
            font-size: 22px;
        }

        .selected {
            border-color: rgba(129, 209, 255, 0.48);
            background: #254968;
        }

        .equal {
            grid-column: span 3;
            border-color: transparent;
            background: linear-gradient(135deg, #9b77ff, #6947df);
            box-shadow: 0 4px 0 #49319d;
            color: white;
            font-size: 24px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 23px;
            color: #707b95;
            font-size: 9px;
            letter-spacing: 1px;
        }

        @media (max-width: 420px) {
            .calculator {
                padding: 21px;
                border-radius: 26px;
            }

            .buttons {
                gap: 9px;
            }

            .btn {
                height: 58px;
                border-radius: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main id="app" class="calculator" aria-label="Calculadora CalcPro">
        <header class="header">
            <div class="brand">
                <span class="brand-icon">
                    <img class="brand-image" src="calcu-logo.jpg" alt="Imagen del logo CalcPro">
                </span>
                <div>
                    <h1 class="brand-name">CALC<span>PRO</span></h1>
                    <p class="brand-caption">CALCULADORA INTELIGENTE</p>
                </div>
            </div>
            <div class="status"><span class="status-dot"></span> LISTA</div>
        </header>

        <section class="screen" aria-label="Pantalla de la calculadora">
            <div class="screen-label">RESULTADO</div>
            <div class="history" aria-live="polite">{{ history }}</div>
            <div class="display" aria-live="polite" aria-atomic="true">{{ current }}</div>
        </section>

        <section class="buttons" aria-label="Teclas de la calculadora">
            <button type="button" class="btn function" aria-label="Borrar todo" @click="clearAll">AC</button>
            <button type="button" class="btn function" aria-label="Borrar último dígito" @click="deleteLast">DEL</button>
            <button type="button" class="btn function" aria-label="Raíz cuadrada" @click="squareRoot">√</button>
            <button type="button" class="btn operator" aria-label="Dividir" @click="chooseOperator('/')">÷</button>

            <button type="button" class="btn" @click="addNumber('7')">7</button>
            <button type="button" class="btn" @click="addNumber('8')">8</button>
            <button type="button" class="btn" @click="addNumber('9')">9</button>
            <button type="button" class="btn operator" aria-label="Multiplicar" @click="chooseOperator('*')">×</button>

            <button type="button" class="btn" @click="addNumber('4')">4</button>
            <button type="button" class="btn" @click="addNumber('5')">5</button>
            <button type="button" class="btn" @click="addNumber('6')">6</button>
            <button type="button" class="btn operator" aria-label="Restar" @click="chooseOperator('-')">−</button>

            <button type="button" class="btn" @click="addNumber('1')">1</button>
            <button type="button" class="btn" @click="addNumber('2')">2</button>
            <button type="button" class="btn" @click="addNumber('3')">3</button>
            <button type="button" class="btn operator" aria-label="Sumar" @click="chooseOperator('+')">+</button>

            <button type="button" class="btn function" aria-label="Elevar a una potencia" @click="chooseOperator('^')">xʸ</button>
            <button type="button" class="btn function" aria-label="Cambiar signo" @click="toggleSign">±</button>
            <button type="button" class="btn" @click="addNumber('0')">0</button>
            <button type="button" class="btn" aria-label="Punto decimal" @click="addNumber('.')">.</button>

            <button type="button" class="btn function" aria-label="Porcentaje" @click="percentage">%</button>
            <button type="button" class="btn equal" aria-label="Calcular resultado" @click="calculate">=</button>
        </section>

        <footer class="footer">
            <span>CALCPRO · 2026</span>
            <span>TECLADO DISPONIBLE</span>
        </footer>
    </main>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="calcu.js"></script>
</body>
</html>
